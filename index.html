<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>PixelCraft Pro | Ultimate Editor</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
</head>
<body>
<div class="container disable">
        <div class="header-row">
            <h2>PixelCraft Pro</h2>
            <button id="theme-toggle"><i class='bx bxs-moon'></i></button>
        </div>

        <div class="wrapper">
            <div class="editor-panel">
                <div class="filter">
                    <label class="title">Filters & Tools</label>
                    <div class="options">
                        <button id="brightness" class="active">Brightness</button>
                        <button id="saturation">Saturation</button>
                        <button id="contrast">Contrast</button>
                        <button id="hue-rotate">Hue</button>
                        <button id="blur">Blur</button>
                        <button id="sepia">Sepia</button>
                        <button id="grayscale">Grayscale</button>
                        <button id="inversion">Inversion</button>
                        <button id="resize">Resize</button>
                        <button id="crop">Crop</button>
                    </div>

                    <div class="slider">
                        <div class="filter-info">
                            <p class="name">Brightness</p>
                            <p class="value">100%</p>
                        </div>
                        <input type="range" value="100" min="0" max="200">
                    </div>

                    <div class="resize-panel">
                        <div class="filter-info"><p class="name">Presets</p></div>
                        <div class="preset-buttons">
                            <button data-w="1" data-h="1">1:1</button>
                            <button data-w="16" data-h="9">16:9</button>
                            <button data-w="9" data-h="16">9:16</button>
                            <button data-w="4" data-h="5">4:5</button>
                        </div>
                        <div class="input-group">
                            <input type="number" id="width-input" placeholder="W">
                            <input type="number" id="height-input" placeholder="H">
                        </div>
